<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>魔物継承記 - テキスト育成RPG</title>
<style>
:root{
  --bg:#131722; --panel:#1d2432; --panel2:#252e3f; --text:#f4f6fb;
  --muted:#aeb8cb; --accent:#8fd36f; --gold:#ffd166; --danger:#ff7878;
  --line:#3b465d; --blue:#74b9ff;
}
*{box-sizing:border-box}
body{
  margin:0;background:linear-gradient(180deg,#10141e,#171d2a 65%,#111620);
  color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;
  min-height:100vh;
}
button,select,input{font:inherit}
button{
  border:1px solid var(--line);background:#2a3448;color:var(--text);border-radius:10px;
  padding:11px 13px;cursor:pointer;font-weight:700;
}
button:hover{background:#35415a}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:#395f31;border-color:#5f8c51}
button.warn{background:#6b4b26;border-color:#9b713e}
button.danger{background:#67313b;border-color:#98505e}
button.slim{padding:7px 10px;font-size:.9rem}
#app{max-width:860px;margin:auto;padding:14px 14px 90px}
header{
  display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px;
}
.logo{font-weight:900;letter-spacing:.05em}
.small{font-size:.88rem;color:var(--muted)}
.panel{
  background:rgba(29,36,50,.96);border:1px solid var(--line);border-radius:14px;
  padding:14px;margin:10px 0;box-shadow:0 8px 24px rgba(0,0,0,.18)
}
.panel h2,.panel h3{margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:650px){.grid,.grid3{grid-template-columns:1fr}}
.statline{display:flex;justify-content:space-between;gap:10px;margin:5px 0}
.bar{height:10px;background:#0e131d;border-radius:20px;overflow:hidden;border:1px solid #30394b}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar.mp>i{background:var(--blue)}
.bar.enemy>i{background:var(--danger)}
.tag{
  display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 8px;
  margin:2px;font-size:.78rem;color:#dbe3f1;background:#222b3a
}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel2)}
.card.active{outline:2px solid var(--gold)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.log{
  background:#0d121b;border:1px solid #2f394c;border-radius:10px;padding:12px;min-height:126px;
  white-space:pre-wrap;line-height:1.65;color:#e7ebf5
}
nav{
  position:fixed;left:0;right:0;bottom:0;background:rgba(13,17,25,.96);
  border-top:1px solid var(--line);padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));
  backdrop-filter:blur(10px);z-index:10
}
nav .inner{max-width:860px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
nav button{padding:9px 5px;font-size:.78rem}
.title{
  text-align:center;padding:40px 12px 24px
}
.title h1{font-size:clamp(2rem,8vw,4rem);margin:0 0 8px}
.title p{color:var(--muted);line-height:1.7}
.notice{color:var(--gold)}
.good{color:#a8e68e}.bad{color:#ff9d9d}
.hr{height:1px;background:var(--line);margin:12px 0}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px;font-size:.92rem}
input[type=range]{width:100%}
.center{text-align:center}
.battleVS{text-align:center;color:var(--gold);font-weight:900;margin:8px}
code{color:#cde6ff}
</style>

<meta name="theme-color" content="#131722">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="魔物継承記">

<style>
html{-webkit-text-size-adjust:100%;touch-action:manipulation}

button,select,input{min-height:44px}

const ELEMENT_ADV = {fire:"wind",wind:"earth",earth:"water",water:"fire",light:"dark",dark:"light"};

const MAX_LEVEL = 99;
let autoTraining = false;
let uidCounter = 1;
function uid(){ return "m"+Date.now().toString(36)+(uidCounter++).toString(36); }
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rint(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function deep(o){return JSON.parse(JSON.stringify(o))}
function natureKey(){return pick(Object.keys(NATURES))}
function traitName(k){return TRAITS[k]?.name||k}
function skillName(k){return SKILLS[k]?.name||k}
function bloodlineTitle(p){
  p=p||0;
  if(p>=10)return "極血統";
  if(p>=6)return "名血";
  if(p>=3)return "良血";
  if(p>=1)return "継承";
  return "初代";
}

function newMonster(species, level=1, overrides={}){
  const def=MONSTERS[species];
  const m={
    uid:uid(), species, level, exp:0,
    nature:overrides.nature||natureKey(),
    traits:overrides.traits||[pick(def.traits)],
    skills:overrides.skills||def.skills.slice(0,3),
    breedPts:overrides.breedPts||{hp:0,atk:0,def:0,mag:0,spd:0},
    plus:overrides.plus||0,
    status:null,statusTurns:0,
    buffs:{atk:0,def:0,mag:0,spd:0},
    buffTurns:{atk:0,def:0,mag:0,spd:0},
    hp:1,mp:1
  };
  const s=calcStats(m); m.hp=s.hp; m.mp=s.mp;
  return m;
}
function totalBreedPts(m){return Object.values(m.breedPts).reduce((a,b)=>a+b,0)}
function calcStats(m){
  const b=MONSTERS[m.species].base;
  const lv=m.level;
  const scale = 0.45 + lv*0.055;
  const out={};
  for(const k of ["hp","mp","atk","def","mag","spd"]){
    let val=b[k]*scale;
    val*=1+((m.plus||0)*0.02);
    if(k!=="mp"){
      const pts=m.breedPts?.[k]||0;
      val*=1+pts*0.02;
      const n=NATURES[m.nature];
      if(n.up===k) val*=1.10;
      if(n.down===k) val*=0.90;
    }
    out[k]=Math.max(1,Math.round(val));
  }
  return out;
}
function xpNeed(level){return Math.round(30+level*level*2.4)}
function displayMonster(m){
  const d=MONSTERS[m.species], s=calcStats(m);
  const plus=(m.plus||0)>0?` +${m.plus}`:"";
  return `${d.name}${plus} Lv.${m.level} [${d.rank}]`;
}
function healMonster(m){const s=calcStats(m);m.hp=s.hp;m.mp=s.mp;m.status=null;m.statusTurns=0}
function fullHeal(){game.monsters.forEach(healMonster)}

let game = null;
let battle = null;
let currentView = "home";
let selectedZone = "meadow";
let breedDraft = {a:null,b:null,child:null,points:0,alloc:{hp:0,atk:0,def:0,mag:0,spd:0}};

function defaultGame(){
  return {
    started:false,name:"",gold:300,potions:5,scoutBait:3,
    monsters:[],party:[],zoneProgress:{meadow:0,forest:0,volcano:0,ruins:0,abyss:0},
    bossesDefeated:0,turns:0,won:false,log:["魔王ヴァルガスが世界への侵攻を始めた。"]
  };
}

function save(){
  if(!game)return;
  localStorage.setItem("monster_legacy_rpg_save",JSON.stringify(game));
}
function load(){
  const x=localStorage.getItem("monster_legacy_rpg_save");
  if(!x)return false;
  try{
    game=JSON.parse(x);
    game.monsters=(game.monsters||[]).map(m=>{
      if(typeof m.plus!=="number")m.plus=0;
      if(!m.breedPts)m.breedPts={hp:0,atk:0,def:0,mag:0,spd:0};
      return m;
    });
    return true;
  }catch(e){return false}
}
function erase(){
  localStorage.removeItem("monster_legacy_rpg_save");
  game=defaultGame();battle=null;currentView="home";render();
}
function byUid(id){return game.monsters.find(m=>m.uid===id)}
function partyMons(){return game.party.map(byUid).filter(Boolean)}
function ranchMons(){return game.monsters.filter(m=>!game.party.includes(m.uid))}
function addLog(t){game.log.unshift(t);game.log=game.log.slice(0,20)}

function startGame(starter){
  const name=(document.getElementById("playerName").value||"旅人").trim().slice(0,12);
  game=defaultGame();game.started=true;game.name=name;
  const m=newMonster(starter,5,{nature:"honest"});
  game.monsters.push(m);game.party=[m.uid];
  addLog(`${MONSTERS[starter].name}が最初の仲間になった。`);
  save();currentView="home";render();
}

function nav(v){ if(battle)return; currentView=v; render(); }
function render(){
  if(!game){load()||(game=defaultGame())}
  const app=document.getElementById("app");
  if(!game.started){app.innerHTML=renderTitle();return}
  app.innerHTML=renderHeader()+(battle?renderBattle():renderView())+renderNav();
}
function renderTitle(){
  return `<div class="title">
    <h1>魔物継承記</h1>
    <p>魔物を仲間にし、育て、配合し、世代を重ねて魔王を討て。</p>
  </div>
  <div class="panel">
    <h2>冒険者名</h2>
    <input id="playerName" maxlength="12" placeholder="旅人" style="width:100%;padding:12px;border-radius:9px;border:1px solid var(--line);background:#101621;color:white">
  </div>
  <div class="panel">
    <h2>最初の仲間を選ぶ</h2>
    <div class="grid3">
      ${starterCard("slime","HPと回復に優れる")}
      ${starterCard("wolf","攻撃と素早さに優れる")}
      ${starterCard("hatchling","成長すると高性能")}
    </div>
  </div>`;
}
function starterCard(id,desc){
  const d=MONSTERS[id];
  return `<div class="card"><h3>${d.name}</h3><div class="small">${FAMILIES[d.family]} / ${d.rank}ランク</div><p>${desc}</p><button class="primary" onclick="startGame('${id}')">この魔物で始める</button></div>`;
}
function renderHeader(){
  return `<header><div><div class="logo">魔物継承記 <span class="small">v0.4.0</span></div><div class="small">${game.name} / 魔王軍撃破 ${game.bossesDefeated}/5</div></div>

function trainExplore(){

  const lead=getLeadAlive();

  const pool=lead.level<=3
    ? ["slime","sparrow","sprout"]

    ? ["slime","wolf","sparrow","fish","sprout","aquaSlime"]

function autoDamage(actor,target,skill=null,enemySide=false){
  const a=calcStats(actor);
  const t=calcStats(target);

  const magic=!!skill&&skill.type==="magic";
  const physical=!skill||skill.type==="physical";

  const atk=magic?a.mag:a.atk;
  const def=magic?t.mag:t.def;
  const power=skill?skill.power:28;
  const element=skill?.element||"none";

  let dmg=(power+atk*.55-def*.28)*.26*(.92+Math.random()*.16);
  let mult=1;

  if(actor.traits.includes("hunt")&&target.hp<calcStats(target).hp*.5)mult*=1.20;
  if(actor.traits.includes("brave")&&actor.hp<calcStats(actor).hp*.35)mult*=1.18;
  if(actor.traits.includes("noct")&&element==="dark")mult*=1.15;
  if(target.traits.includes("fireguard")&&element==="fire")mult*=.75;
  if(target.traits.includes("iron")&&physical)mult*=.90;

  if(enemySide)mult*=.70;

  dmg=Math.max(1,Math.round(dmg*mult));
  target.hp=Math.max(0,target.hp-dmg);
}

function autoHeal(actor){
  const maxHp=calcStats(actor).hp;
  const s=calcStats(actor);

  const amt=Math.max(
    1,
    Math.round(
      (maxHp*.18+s.mag*.03)*
      (.92+Math.random()*.16)
    )
  );

  actor.hp=Math.min(maxHp,actor.hp+amt);
}

function autoChooseDamageSkill(m){
  const candidates=m.skills
    .map(k=>({key:k,skill:SKILLS[k]}))
    .filter(x=>
      x.skill
      &&
      (x.skill.type==="physical"||x.skill.type==="magic")
      &&
      x.skill.mp<=m.mp
    );

  if(!candidates.length)return null;

  candidates.sort((a,b)=>b.skill.power-a.skill.power);
  return candidates[0];
}

function autoPartyTurn(actor,enemy){
  const hpRate=actor.hp/calcStats(actor).hp;
  const healKey=actor.skills.find(
    k=>SKILLS[k]?.type==="heal"&&SKILLS[k].mp<=actor.mp
  );

  if(hpRate<=.32&&healKey){
    actor.mp-=SKILLS[healKey].mp;
    autoHeal(actor);
    return;
  }

  const best=autoChooseDamageSkill(actor);

  if(best){
    actor.mp-=best.skill.mp;
    autoDamage(actor,enemy,best.skill,false);
  }else{
    autoDamage(actor,enemy,null,false);
  }
}

function autoEnemyTurn(enemy,target,state){
  const hpRate=enemy.hp/calcStats(enemy).hp;
  const healKey=enemy.skills.find(
    k=>SKILLS[k]?.type==="heal"&&SKILLS[k].mp<=enemy.mp
  );

  if(hpRate<=.40&&healKey&&state.heals<2){
    enemy.mp-=SKILLS[healKey].mp;
    autoHeal(enemy);
    state.heals++;
    return;
  }

  const best=autoChooseDamageSkill(enemy);

  if(best&&Math.random()<.70){
    enemy.mp-=best.skill.mp;
    autoDamage(enemy,target,best.skill,true);
  }else{
    autoDamage(enemy,target,null,true);
  }
}

function runOneAutoTrainingBattle(){
  fullHeal();

  const enemy=autoTrainingEnemy();
  const state={heals:0};
  let turn=0;

  while(
    turn<40
    &&
    enemy.hp>0
    &&
    partyMons().some(m=>m.hp>0)
  ){
    turn++;

    let active=partyMons().find(m=>m.hp>0);
    if(!active)break;

    const ps=calcStats(active).spd;
    const es=calcStats(enemy).spd;

    if(ps>=es){
      autoPartyTurn(active,enemy);

      if(enemy.hp>0){
        active=partyMons().find(m=>m.hp>0);
        if(active)autoEnemyTurn(enemy,active,state);
      }
    }else{
      autoEnemyTurn(enemy,active,state);

      active=partyMons().find(m=>m.hp>0);
      if(enemy.hp>0&&active){
        autoPartyTurn(active,enemy);
      }
    }
  }

  const win=enemy.hp<=0;

  if(win){
    const exp=Math.round(enemy.level*14*2.2);

    partyMons().forEach((m,i)=>{
      gainExp(
        m,
        Math.round(exp*(i===0?1:.75))
      );
    });

    fullHeal();
    return {win:true,exp};
  }

  fullHeal();
  return {win:false,exp:0};
}

function setAutoTrainStatus(text){

async function startAutoTraining(count){
  if(autoTraining||battle)return;
  if(!partyMons().length){
    alert("仲間がいません。");
    return;
  }

  const before=partyMons().map(m=>({
    uid:m.uid,
    level:m.level
  }));

  autoTraining=true;
  render();

  let wins=0;
  let losses=0;
  let totalExp=0;
  let executed=0;

  const chunk=count>=1000?25:count>=100?20:10;

  for(let i=0;i<count;i++){
    if(partyMons().every(m=>m.level>=MAX_LEVEL)){
      break;
    }

    const result=runOneAutoTrainingBattle();
    executed++;

    if(result.win){
      wins++;
      totalExp+=result.exp;
    }else{
      losses++;
    }

    if(executed%chunk===0||executed===count){
      setAutoTrainStatus(
        `高速特訓中… ${executed}/${count}回　勝利${wins} / 敗北${losses}`
      );

      await new Promise(resolve=>setTimeout(resolve,0));
    }
  }

  const changes=partyMons().map(m=>{
    const b=before.find(x=>x.uid===m.uid);
    return `${MONSTERS[m.species].name}: Lv.${b?.level??m.level} → Lv.${m.level}`;
  });

  addLog(
    `高速特訓完了：${wins}勝${losses}敗 / 獲得EXP ${totalExp} / ${changes.join("、")}`
  );

  autoTraining=false;
  save();
  currentView="explore";
  render();

  setTimeout(()=>{
    alert(
      `高速特訓完了\n\n`+
      `実行: ${executed}回\n`+
      `勝利: ${wins}\n`+
      `敗北: ${losses}\n`+
      `獲得EXP: ${totalExp}\n\n`+
      changes.join("\n")
    );
  },0);
}

function foes(){return battle.enemies.filter(e=>e.hp>0&&!e.caught)}

function cmdActor(){return allies().find(m=>!battle.cmds.some(c=>c.uid===m.uid))}

function startBattle(enemy,isBoss,zone,options={}){
  partyMons().forEach(m=>{m.status=null;m.statusTurns=0;m.guard=false;m.buffs={atk:0,def:0,mag:0,spd:0};m.buffTurns={atk:0,def:0,mag:0,spd:0}});

    log:[`${options.training?"訓練相手":isBoss?"強敵":"野生"}の ${enemies.map(displayMonster).join("・")} が現れた！`],locked:false};
  render();
}
function battleLog(t){battle.log.unshift(t);battle.log=battle.log.slice(0,12)}
function effectiveStats(m){
  const s=calcStats(m), turn=battle?.turn||1;
  let mult={atk:1,def:1,mag:1,spd:1};
  for(const k of Object.keys(mult)) if((m.buffTurns?.[k]||0)>0) mult[k]+=m.buffs[k]||0;
  if(m.traits.includes("quick")&&turn<=3)mult.spd*=1.2;
  return {...s,atk:Math.round(s.atk*mult.atk),def:Math.round(s.def*mult.def),mag:Math.round(s.mag*mult.mag),spd:Math.round(s.spd*mult.spd)};
}

function renderBattleActions(me){

    <button onclick="chooseAct('defend')">防御</button>

    ${battle.isBoss?"":battle.training?`<button onclick="flee()">訓練をやめる</button>`:`<button class="warn" onclick="chooseAct('scout')">スカウト</button><button onclick="chooseAct('scout',null,true)" ${game.scoutBait<=0?"disabled":""}>好物+スカウト (${game.scoutBait})</button><button onclick="flee()">にげる</button>`}

function chooseAct(kind,skill,bait){
  if(!battle||battle.locked)return;const me=cmdActor();if(!me)return;
  const sk=skill?SKILLS[skill]:null;
  if(sk&&me.mp<sk.mp)return;if(kind==="potion"&&game.potions<=0)return;
  const needT=kind==="attack"||kind==="scout"||(sk&&["physical","magic","status"].includes(sk.type));
  if(needT&&foes().length>1){battle.pend={kind,skill,bait:!!bait};render();return}
  pushCmd({kind,skill,bait:!!bait,t:needT?foes()[0].uid:null});
}
function pickTarget(id){const p=battle.pend;if(p)pushCmd({kind:p.kind,skill:p.skill,bait:p.bait,t:id})}
function cancelPend(){battle.pend=null;render()}
function pushCmd(c){const a=cmdActor();if(!a)return;battle.cmds.push({...c,uid:a.uid});battle.pend=null;if(cmdActor())render();else resolveRound()}
function playerAction(){chooseAct("attack")}
function playerSkill(i){const m=cmdActor();if(m)chooseAct("skill",m.skills[i])}
function usePotion(){chooseAct("potion")}
function resolveRound(){
  if(!battle||battle.locked)return;battle.locked=true;
  const acts=battle.cmds.map(c=>({side:"p",actor:byUid(c.uid),c}));
  foes().forEach(e=>acts.push({side:"e",actor:e,c:chooseEnemyAction(e)}));
  acts.forEach(a=>{a.k=effectiveStats(a.actor).spd*(.88+Math.random()*.24);if(a.c.kind==="defend")a.actor.guard=true});
  acts.sort((a,b)=>b.k-a.k);
  for(const {side,actor,c} of acts){
    if(actor.hp<=0||actor.caught)continue;
    if(!foes().length||!allies().length)break;
    let target=actor;
    if(side==="e")target=pick(allies());
    else if(c.t)target=foes().find(e=>e.uid===c.t)||pick(foes());
    const was=target.hp>0;
    performAction(side,actor,target,c);
    if(was&&target.hp<=0&&!target.caught)battleLog(`${MONSTERS[target.species].name}は倒れた！`);
  }
  [...allies(),...foes()].forEach(m=>{const w=m.hp>0;endTurnEffects(m);if(w&&m.hp<=0)battleLog(`${MONSTERS[m.species].name}は倒れた！`)});
  [...partyMons(),...battle.enemies].forEach(m=>{m.guard=false});
  if(!foes().length){winBattle();return}
  if(!allies().length){loseBattle();return}
  [...partyMons(),...battle.enemies].forEach(tickBuffs);
  battle.turn++;battle.cmds=[];battle.locked=false;save();render();
}
function canAct(m){
  if(m.status==="sleep"){
    if(Math.random()<.4){m.status=null;m.statusTurns=0;battleLog(`${MONSTERS[m.species].name}は目を覚ました！`);return true}
    battleLog(`${MONSTERS[m.species].name}は眠っている。`);return false;
  }
  if(m.status==="paralyze"&&Math.random()<.3){battleLog(`${MONSTERS[m.species].name}は麻痺して動けない！`);return false}
  return true;
}
function performAction(side,actor,target,act){
  if(!canAct(actor))return;
  if(act.kind==="potion"){if(game.potions<=0)return;game.potions--;const s=calcStats(actor);const h=Math.round(s.hp*.45);actor.hp=Math.min(s.hp,actor.hp+h);battleLog(`${MONSTERS[actor.species].name}は薬草で${h}回復した。`);return}
  if(act.kind==="defend"){battleLog(`${MONSTERS[actor.species].name}は身を守っている。`);return}
  if(act.kind==="scout"){doScout(actor,target,act.bait);return}
  if(act.kind==="attack"){dealDamage(actor,target,{name:"通常攻撃",type:"physical",power:28,mp:0,element:"none"});return}
  if(act.kind==="skill"){const sk=SKILLS[act.skill];actor.mp-=sk.mp;applySkill(actor,target,sk)}
}
function chooseEnemyAction(en){
  const hpRate=en.hp/calcStats(en).hp;

  const available=en.skills.filter(k=>{
    if(SKILLS[k].mp>en.mp)return false;

    if(
      SKILLS[k].type==="heal"
      &&
      (
        hpRate>.45
        ||
        (battle?.enemyHealUsed||0)>=2
      )
    ){
      return false;
    }

    return true;
  });

  if(available.length&&Math.random()<.72){
    return {kind:"skill",skill:pick(available)};
  }

  return {kind:"attack"};
}
function applySkill(actor,target,sk){
  if(sk.type==="heal"){
    const s=effectiveStats(actor);
    const maxHp=calcStats(actor).hp;

    const amt=Math.max(
      1,
      Math.round(
        (maxHp*.18+s.mag*.03)*
        (0.9+Math.random()*.2)
      )
    );

    actor.hp=Math.min(maxHp,actor.hp+amt);

    if(battle&&battle.enemies.includes(actor)){
      battle.enemyHealUsed=(battle.enemyHealUsed||0)+1;
    }

    battleLog(`${MONSTERS[actor.species].name}の${sk.name}！ HPが${amt}回復。`);
    return;
  }
  if(sk.type==="buff"){
    actor.buffs[sk.stat]=sk.amount;actor.buffTurns[sk.stat]=sk.turns;battleLog(`${MONSTERS[actor.species].name}の${sk.name}！ ${sk.stat==="atk"?"攻撃":"能力"}が上がった。`);return;
  }
  if(sk.type==="status"){
    const resist=target.traits.includes("root")?.75:1;
    if(Math.random()<sk.chance*resist){target.status=sk.status;target.statusTurns=3;battleLog(`${MONSTERS[actor.species].name}の${sk.name}！ ${MONSTERS[target.species].name}は${statusText(target)}になった。`)}
    else battleLog(`${sk.name}は効かなかった。`);
    return;
  }
  dealDamage(actor,target,sk);
}
function elemMultiplier(element,target){
  if(element==="none")return 1;
  const targetSkills=MONSTERS[target.species].skills.map(k=>SKILLS[k]?.element);
  let targetElem=targetSkills.find(x=>x&&x!=="none")||"none";
  if(ELEMENT_ADV[element]===targetElem)return 1.35;
  if(ELEMENT_ADV[targetElem]===element)return .75;
  return 1;
}
function dealDamage(actor,target,sk){
  const a=effectiveStats(actor),t=effectiveStats(target);
  const atk=sk.type==="magic"?a.mag:a.atk;
  const def=sk.type==="magic"?t.mag:t.def;

  // Ver.0.3: 通常戦を概ね3〜5ターンにするため基礎ダメージを抑制
  let dmg=(sk.power+atk*.55-def*.28)*0.26*(0.9+Math.random()*.2);
  let mult=elemMultiplier(sk.element,target);

  if(actor.traits.includes("hunt")&&target.hp<calcStats(target).hp*.5)mult*=1.20;
  if(actor.traits.includes("brave")&&actor.hp<calcStats(actor).hp*.35)mult*=1.18;
  if(actor.traits.includes("noct")&&sk.element==="dark")mult*=1.15;
  if(target.traits.includes("fireguard")&&sk.element==="fire")mult*=.75;
  if(target.traits.includes("iron")&&sk.type==="physical")mult*=.90;

  if(battle&&battle.enemies.includes(actor))mult*=battle.enemyDamageMult||1;
  if(target.guard)mult*=.5;

  dmg=Math.max(1,Math.round(dmg*mult));
  target.hp=Math.max(0,target.hp-dmg);

  let note=mult>=1.30?" 弱点！":mult<=.78?" 耐性！":"";
  battleLog(`${MONSTERS[actor.species].name}の${sk.name}！ ${dmg}ダメージ。${note}`);
}
function endTurnEffects(m){
  if(m.hp<=0)return;
  const s=calcStats(m);
  if(m.status==="poison"){
    const dmg=Math.max(1,Math.floor(s.hp*.08));m.hp=Math.max(0,m.hp-dmg);battleLog(`${MONSTERS[m.species].name}は毒で${dmg}ダメージ。`);
  }
  if(m.traits.includes("regen")&&m.hp>0){const h=Math.max(1,Math.floor(s.hp*.05));m.hp=Math.min(s.hp,m.hp+h)}
  if(m.traits.includes("mana")){const h=Math.max(1,Math.floor(s.mp*.05));m.mp=Math.min(s.mp,m.mp+h)}
}
function tickBuffs(m){for(const k of Object.keys(m.buffTurns||{})) if(m.buffTurns[k]>0)m.buffTurns[k]--}

function scoutChance(withBait=false,en,me){
  if(!battle||battle.isBoss||battle.training)return 0;
  en=en||foes()[0];me=me||battleLead();const es=calcStats(en);
  let chance=.10+(1-en.hp/es.hp)*.65+Math.max(-.12,(me.level-en.level)*.012);
  if(en.status)chance+=.12;
  if(me.traits.includes("scout"))chance+=.08;
  if(withBait)chance+=.20;
  return clamp(chance,.05,.90);
}
function scout(withBait){chooseAct("scout",null,!!withBait)}
function doScout(me,en,bait){
  const chance=scoutChance(bait,en,me),pct=Math.round(chance*100);
  if(bait)game.scoutBait=Math.max(0,game.scoutBait-1);
  if(Math.random()<chance){
    const s=calcStats(en);en.hp=s.hp;en.mp=s.mp;en.status=null;en.caught=true;
    game.monsters.push(en);if(game.party.length<3)game.party.push(en.uid);
    addLog(`${MONSTERS[en.species].name}のスカウトに成功した！（成功率${pct}%）`);
    battleLog(`${MONSTERS[en.species].name}が仲間になった！`);
  }else battleLog(`${MONSTERS[en.species].name}のスカウト失敗……（成功率${pct}%）`);
}
function flee(){
  if(!battle||battle.locked)return;
  if(Math.random()<.75){addLog("戦闘から逃げ出した。");battle=null;save();render()}
  else{battleLog("逃げられなかった！");pushCmd({kind:"wait"})}
}
function gainExp(m,amt){
  if(m.level>=MAX_LEVEL){
    m.level=MAX_LEVEL;
    m.exp=0;
    return 0;
  }

  m.exp+=amt;
  let leveled=0;

  while(m.level<MAX_LEVEL && m.exp>=xpNeed(m.level)){
    m.exp-=xpNeed(m.level);
    m.level++;
    leveled++;
    healMonster(m);
  }

  if(m.level>=MAX_LEVEL){
    m.level=MAX_LEVEL;
    m.exp=0;
  }

  return leveled;
}
function winBattle(){
  const z=ZONES.find(x=>x.id===battle.zoneId),boss=battle.enemies[0];
  const dead=battle.enemies.filter(e=>!e.caught);
  const bm=e=>battle.isBoss&&e===boss;
  const exp=Math.round(dead.reduce((t,e)=>t+e.level*14*(bm(e)?2.8:1),0)*(battle.expMult||1));
  const gold=Math.round(dead.reduce((t,e)=>t+e.level*8*(bm(e)?3:1),0)*(battle.goldMult||1));
  allies().forEach((m,i)=>{
    const before=m.level;gainExp(m,Math.round(exp*(i===0?1:.75)));
    if(m.level>before)addLog(`${MONSTERS[m.species].name}がLv.${m.level}に上がった！`);
  });
  game.gold+=gold;
  if(battle.isBoss){
    if(game.bossesDefeated===z.unlock){game.bossesDefeated++;addLog(`${z.name}の支配者を撃破した！ 新たな地域への道が開いた。`)}
    if(z.id==="abyss"){game.won=true;addLog("魔王ヴァルガスを討ち、世界に平和が戻った！")}
  }else if(battle.training)addLog(`訓練を終えた。経験値${exp}、${gold}Gを獲得。`);
  else addLog(`${dead.length?dead.map(e=>MONSTERS[e.species].name).join("・")+"を倒した。":"スカウトで戦闘終了。"}経験値${exp}、${gold}Gを獲得。`);
  battle=null;save();currentView="home";render();
}
function loseBattle(){
  if(battle?.training){
    fullHeal();
    addLog("訓練で全滅したが、教官に救助された。ペナルティなしで全員回復した。");
    battle=null;
    save();
    currentView="explore";
    render();
    return;
  }
  game.gold=Math.floor(game.gold*.8);
  fullHeal();
  addLog("全滅した……。所持金の20%を失い、王都へ戻された。");
  battle=null;
  save();
  currentView="home";
  render();
}

function renderParty(){
  return `<div class="panel"><h2>パーティ ${game.party.length}/3</h2>${partyMons().map((m,i)=>monsterDetail(m,true,i)).join("")||"パーティなし"}</div>
  <div class="panel"><h2>牧場 ${ranchMons().length}</h2>${ranchMons().map(m=>monsterDetail(m,false)).join("")||"<div class='small'>牧場は空です。</div>"}</div>`;
}
function monsterDetail(m,inParty,index=-1){
  const d=MONSTERS[m.species],s=calcStats(m),n=NATURES[m.nature];
  return `<div class="card">
    <div class="statline"><b>${displayMonster(m)}</b><span>${FAMILIES[d.family]}</span></div>
    <div class="small">性格 ${n.name} / 特性 ${m.traits.map(traitName).join("・")}</div>
    <div class="notice">【${bloodlineTitle(m.plus)}】血統 +${m.plus||0}　全能力 +${(m.plus||0)*2}%</div>
    <div class="kv"><span>能力</span><span>HP ${s.hp} / MP ${s.mp} / 攻 ${s.atk} / 防 ${s.def} / 魔 ${s.mag} / 速 ${s.spd}</span>
    <span>スキル</span><span>${m.skills.map(skillName).join("・")}</span>
    <span>配合P</span><span>${Object.entries(m.breedPts).filter(x=>x[1]).map(([k,v])=>`${statJP(k)}+${v}`).join(" / ")||"なし"}</span></div>
    <div class="actions">
      ${inParty?`<button class="slim" onclick="moveParty(${index},-1)">↑</button><button class="slim" onclick="moveParty(${index},1)">↓</button><button class="slim" onclick="toRanch('${m.uid}')">牧場へ</button>`:`<button class="slim primary" onclick="toParty('${m.uid}')" ${game.party.length>=3?"disabled":""}>パーティへ</button>`}
    </div>
  </div>`;
}
function statJP(k){return ({hp:"HP",atk:"攻撃",def:"防御",mag:"魔力",spd:"素早さ"})[k]||k}
function toRanch(id){game.party=game.party.filter(x=>x!==id);save();render()}
function toParty(id){if(game.party.length>=3)return;game.party.push(id);save();render()}
function moveParty(i,d){const j=i+d;if(j<0||j>=game.party.length)return;[game.party[i],game.party[j]]=[game.party[j],game.party[i]];save();render()}

function breedResult(a,b){
  const keys=[a.species,b.species].sort();
  const special=SPECIAL_NORM[keys.join("+")];
  if(special)return {species:special,special:true};
  const fa=MONSTERS[a.species].family,fb=MONSTERS[b.species].family;
  if(fa===fb)return {species:strongerFamilySpecies(fa,a,b),special:false};
  const cross=FAMILY_CROSS[[fa,fb].sort().join("|")]||FAMILY_CROSS[`${fa}|${fb}`]||FAMILY_CROSS[`${fb}|${fa}`];
  return {species:FAMILY_DEFAULT[cross||pick([fa,fb])],special:false};
}
function strongerFamilySpecies(family,a,b){
  const avg=(a.level+b.level)/2;
  const choices=Object.entries(MONSTERS).filter(([id,d])=>d.family===family&&id!=="darkLord").sort((x,y)=>rankNum(x[1].rank)-rankNum(y[1].rank));
  const target=avg>=35?5:avg>=25?4:avg>=16?3:2;
  let eligible=choices.filter(x=>rankNum(x[1].rank)<=target);
  return (eligible.at(-1)||choices[0])[0];
}
function rankNum(r){return ({F:1,E:2,D:3,C:4,B:5,A:6,S:7})[r]||1}
function inheritedPoints(a,b){return Math.min(10,Math.min(5,Math.floor(a.level/10))+Math.min(5,Math.floor(b.level/10)))}
function breedGrowthBonus(a,b){
  const minLv=Math.min(a.level,b.level);
  if(minLv>=40)return 4;
  if(minLv>=30)return 3;
  if(minLv>=20)return 2;
  if(minLv>=10)return 1;
  return 0;
}
function childPlus(a,b){
  const parent=Math.max(a.plus||0,b.plus||0);
  return Math.min(10,parent+breedGrowthBonus(a,b));
}

function renderBreed(){
  const mons=game.monsters;
  if(mons.length<2)return `<div class="panel"><h2>継承の儀</h2><p>配合には2体以上の魔物が必要です。</p></div>`;
  const a=byUid(breedDraft.a),b=byUid(breedDraft.b);
  let preview="";
  if(a&&b&&a.uid!==b.uid){
    const r=breedResult(a,b),d=MONSTERS[r.species],pts=inheritedPoints(a,b),plus=childPlus(a,b),growth=breedGrowthBonus(a,b);
    preview=`<div class="panel"><h3>配合結果</h3>
      <p><b>${displayMonster(a)}</b> × <b>${displayMonster(b)}</b></p>
      <p>→ <b>${d.name} +${plus}</b> <span class="notice">【${bloodlineTitle(plus)}】</span> ${r.special?"<span class='notice'>【特殊配合】</span>":""}</p>
      <div class="small">${FAMILIES[d.family]} / ${d.rank}ランク / Lv.1で誕生</div>
      <p class="notice"><b>血統：+${Math.max(a.plus||0,b.plus||0)} → +${plus}　全能力 +${plus*2}%</b></p>
      <p>今回の育成ボーナス：<b>+${growth}</b>（両親の低い方のLvで決定）</p>
      <p class="small">Lv10:+1 / Lv20:+2 / Lv30:+3 / Lv40:+4。Lv9以下では+値は増えません。</p>
      <p>獲得できる継承ポイント：<b>${pts}pt</b></p>
      <p class="small">配合すると親2体はいなくなります。子は親のスキル・特性候補を一部継承します。</p>
      <button class="primary" onclick="prepareBreed()">継承ポイントを振り分ける</button>
    </div>`;
  }
  const success=game.lastBreedResult?`<div class="panel center">
    <div class="notice"><b>★ 配合成功 ★</b></div>
    <h2>【${game.lastBreedResult.title}】${MONSTERS[game.lastBreedResult.species].name} +${game.lastBreedResult.plus}</h2>
    <p><b>全能力 +${game.lastBreedResult.plus*2}%</b>　/　配合P ${game.lastBreedResult.points}</p>
    <button onclick="clearBreedResult()">確認</button>
  </div>`:"";
  return `${success}<div class="panel"><h2>継承の儀</h2>
    <p class="small">育てた2体を配合し、新しいLv.1の魔物を誕生させます。親は配合後にいなくなります。</p>
    <label>親A</label><select onchange="breedSelect('a',this.value)" style="width:100%;padding:10px;margin:5px 0 10px;background:#101621;color:white">
      <option value="">選択</option>${mons.map(m=>`<option value="${m.uid}" ${breedDraft.a===m.uid?"selected":""}>${displayMonster(m)}</option>`).join("")}
    </select>
    <label>親B</label><select onchange="breedSelect('b',this.value)" style="width:100%;padding:10px;margin:5px 0;background:#101621;color:white">
      <option value="">選択</option>${mons.map(m=>`<option value="${m.uid}" ${breedDraft.b===m.uid?"selected":""}>${displayMonster(m)}</option>`).join("")}
    </select>
    ${a&&b&&a.uid===b.uid?"<p class='bad'>同じ個体は選べません。</p>":""}
  </div>${preview}${breedDraft.child?renderBreedAllocation():""}`;
}
function clearBreedResult(){
  game.lastBreedResult=null;
  save();
  render();
}
function breedSelect(k,v){breedDraft[k]=v||null;breedDraft.child=null;render()}
function prepareBreed(){
  const a=byUid(breedDraft.a),b=byUid(breedDraft.b);if(!a||!b||a.uid===b.uid)return;
  const r=breedResult(a,b);breedDraft.child=r.species;breedDraft.points=inheritedPoints(a,b);breedDraft.alloc={hp:0,atk:0,def:0,mag:0,spd:0};render();
}
function renderBreedAllocation(){
  const used=Object.values(breedDraft.alloc).reduce((a,b)=>a+b,0),left=breedDraft.points-used;
  return `<div class="panel"><h3>${MONSTERS[breedDraft.child].name} の継承ポイント</h3>
  <p>残り <b>${left}</b> / ${breedDraft.points}pt　<span class="small">1pt＝対象種族値+2%</span></p>
  ${["hp","atk","def","mag","spd"].map(k=>`<div class="statline"><span>${statJP(k)}：${breedDraft.alloc[k]}pt</span><span><button class="slim" onclick="allocBreed('${k}',-1)">−</button> <button class="slim" onclick="allocBreed('${k}',1)" ${left<=0?"disabled":""}>＋</button></span></div>`).join("")}
  <div class="hr"></div>
  <button class="primary" onclick="confirmBreed()" ${left!==0?"disabled":""}>この配分で配合する</button>
  </div>`;
}
function allocBreed(k,d){
  const used=Object.values(breedDraft.alloc).reduce((a,b)=>a+b,0);
  if(d>0&&used>=breedDraft.points)return;
  breedDraft.alloc[k]=clamp(breedDraft.alloc[k]+d,0,10);render();
}
function confirmBreed(){
  const a=byUid(breedDraft.a),b=byUid(breedDraft.b);if(!a||!b)return;
  const inheritSkills=[...new Set([...a.skills,...b.skills,...MONSTERS[breedDraft.child].skills])].slice(0,4);
  const inheritTraits=[...new Set([...a.traits,...b.traits,...MONSTERS[breedDraft.child].traits])].slice(0,2);
  const plus=childPlus(a,b);
  const child=newMonster(breedDraft.child,1,{
    nature:Math.random()<.4?a.nature:Math.random()<.67?b.nature:natureKey(),
    skills:inheritSkills,traits:inheritTraits,breedPts:deep(breedDraft.alloc),plus
  });
  game.party=game.party.filter(id=>id!==a.uid&&id!==b.uid);
  game.monsters=game.monsters.filter(m=>m.uid!==a.uid&&m.uid!==b.uid);
  game.monsters.push(child);
  if(game.party.length<3)game.party.push(child.uid);
  game.lastBreedResult={
    species:child.species,
    plus:child.plus,
    points:totalBreedPts(child),
    title:bloodlineTitle(child.plus)
  };
  addLog(`配合成功！【${bloodlineTitle(child.plus)}】${MONSTERS[child.species].name} +${child.plus} が誕生。全能力 +${child.plus*2}%！`);
  breedDraft={a:null,b:null,child:null,points:0,alloc:{hp:0,atk:0,def:0,mag:0,spd:0}};
  save();render();
}

function renderSave(){
  return `<div class="panel"><h2>冒険の記録</h2>
    <p>データはこのブラウザの <code>localStorage</code> に保存されます。</p>
    <div class="actions"><button class="primary" onclick="save();alert('保存しました')">今すぐ保存</button><button onclick="exportSave()">セーブデータを書き出す</button><button onclick="importSave()">セーブデータを読み込む</button><button class="danger" onclick="if(confirm('本当に最初からやり直しますか？'))erase()">最初から</button></div>
  </div>
  <div class="panel"><h3>図鑑進捗</h3><p>仲間にした魔物：${new Set(game.monsters.map(m=>m.species)).size}種 / ${Object.keys(MONSTERS).length}種（現在所持）</p>
  <p>魔王軍撃破：${game.bossesDefeated}/5</p></div>`;
}
function exportSave(){
  const data=btoa(unescape(encodeURIComponent(JSON.stringify(game))));
  prompt("この文字列をコピーしてください",data);
}
function importSave(){
  const data=prompt("セーブ文字列を貼り付けてください");if(!data)return;
  try{game=JSON.parse(decodeURIComponent(escape(atob(data))));save();battle=null;currentView="home";render()}catch(e){alert("読み込みに失敗しました")}
}

window.startGame=startGame;window.nav=nav;window.rest=rest;window.buyPotion=buyPotion;window.buyBait=buyBait;
window.explore=explore;window.trainExplore=trainExplore;window.startAutoTraining=startAutoTraining;window.challengeBoss=challengeBoss;window.playerAction=playerAction;window.playerSkill=playerSkill;
window.chooseAct=chooseAct;window.pickTarget=pickTarget;window.cancelPend=cancelPend;window.usePotion=usePotion;
window.scout=scout;window.flee=flee;window.toRanch=toRanch;window.toParty=toParty;window.moveParty=moveParty;
window.breedSelect=breedSelect;window.prepareBreed=prepareBreed;window.allocBreed=allocBreed;window.confirmBreed=confirmBreed;window.clearBreedResult=clearBreedResult;
window.save=save;window.erase=erase;window.exportSave=exportSave;window.importSave=importSave;

load()||(game=defaultGame());
render();
</script>
